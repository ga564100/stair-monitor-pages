name: Pages HTTP JSON smoke
on:
  push:
    paths:
      - .github/workflows/pages-http-smoke.yml
      - snapshot.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-http-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify anonymous HTTPS HTML and JSON
        shell: bash
        run: |
          set -euo pipefail
          root="https://ga564100.github.io/stair-monitor-pages"
          curl -fsSL --retry 6 --retry-delay 3 --retry-all-errors --connect-timeout 8 --max-time 30 \
            "$root/?smoke=${GITHUB_RUN_ID}" -o /tmp/index.html
          expected=$(python - <<'PY'
          import json
          print(json.load(open('snapshot.json',encoding='utf8'))['snapshotId'])
          PY
          )
          observed=''
          for attempt in $(seq 1 15); do
            curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 8 --max-time 30 \
              "$root/snapshot.json?smoke=${GITHUB_RUN_ID}-${attempt}" -o /tmp/snapshot.json || true
            observed=$(python - <<'PY'
          import json
          try: print(json.load(open('/tmp/snapshot.json',encoding='utf8')).get('snapshotId',''))
          except Exception: print('')
          PY
          )
            if [ "$observed" = "$expected" ]; then break; fi
            echo "PAGES_WAIT_SOURCE_MATCH attempt=$attempt"
            sleep 12
          done
          test "$observed" = "$expected" || { echo "::error::GitHub Pages still served stale snapshot"; exit 1; }
          echo "PAGES_MATCH_SOURCE_ID $observed"
          python - <<'PY'
          import json, re
          from pathlib import Path
          html = Path("/tmp/index.html").read_text(encoding="utf-8")
          raw = Path("/tmp/snapshot.json").read_bytes()
          assert html.lower().lstrip().startswith("<!doctype html>"), "HTML failed"
          assert 'fetch("./snapshot.json"' in html, "relative public JSON fetch missing"
          assert 'B100（長抱參考）' in html, "five-row B100 UI not served"
          assert 'for(let p of ["S0","S50","B70","B50","B100"])' in html, "B100 browser rendering missing"
          assert b"ghp_" not in raw and b"github_pat_" not in raw, "secret-looking string"
          assert len(raw) < 16000, "JSON not minimal"
          snap = json.loads(raw)
          assert snap["schema"] == "STAIR_PUBLIC_OBSERVATION_V1"
          assert snap["mode"] == "OBSERVATION_ONLY"
          assert snap["livePitCertified"] is False
          assert snap["automaticTrading"] is False
          assert snap["privatePolicyWriteEnabled"] is False
          assert set(snap["markets"]) == {"TW", "US"}
          for key in ("TW","US"):
              v=snap["markets"][key]
              assert set(v["performance"])=={"S0","S50","B70","B50","B100"}
              assert all(isinstance(v["performance"][name]["FULL"],dict)
                         and isinstance(v["performance"][name]["FULL"].get("cagr"),(float,int))
                         for name in ("S0","S50","B70","B50","B100"))
              assert v["formalAlarm"]=="NOT_CERTIFIED"
          tw=snap["markets"]["TW"]
          if tw.get("calendarExceptionResearch") is True:
              assert tw["observationStatus"]=="DATA_BLOCKED"
              assert tw["dataAsOf"]==tw["indexPrice"]["asOf"]==tw["etfPrice"]["asOf"]
          for market in snap["markets"].values():
              assert market["verifiedCurrent"] is None
              assert market["formalAlarm"] == "NOT_CERTIFIED"
              assert re.fullmatch(r"\d{4}-\d{2}-\d{2}", market["indexPrice"]["asOf"])
              assert re.fullmatch(r"\d{4}-\d{2}-\d{2}", market["etfPrice"]["asOf"])
          print("ANONYMOUS_GITHUB_PAGES_HTTP_JSON_SMOKE_PASS", snap["snapshotId"], len(raw))
          PY
